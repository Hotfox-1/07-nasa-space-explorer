<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="brand" href="#mainContent" aria-label="NASA Space Explorer home">
        <img src="img/NASA-Logo-Large.jpg" alt="NASA insignia" class="logo" />
        <span class="brand-copy">
          <strong>NASA</strong>
          <span>National Aeronautics and<br />Space Administration</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#mainContent">Space Explorer</a>
        <a href="https://www.nasa.gov/" target="_blank" rel="noreferrer">NASA.gov ↗</a>
      </nav>
    </header>

    <main id="mainContent">
      <section class="page-intro" aria-labelledby="pageTitle">
        <p class="eyebrow">ASTRONOMY PICTURE OF THE DAY</p>
        <h1 id="pageTitle">Explore the universe</h1>
        <p class="site-description">Discover a new view of the cosmos with NASA's Astronomy Picture of the Day.</p>
      </section>

      <section class="filters" aria-label="Choose a date range">
      <label class="filter-field" for="startDate">
        <span>From</span>
        <input type="date" id="startDate" />
      </label>
      <label class="filter-field" for="endDate">
        <span>Through</span>
        <input type="date" id="endDate" />
      </label>
      <button id="getImagesButton" type="button">Get Space Images</button>
      </section>

      <div id="gallery" class="gallery" aria-live="polite" aria-busy="false">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
      </div>
    </main>
  </div>

  <dialog id="photoModal" class="photo-modal" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button id="closeModalButton" class="modal-close" type="button" aria-label="Close photo details">&times;</button>
      <img id="modalImage" class="modal-image" alt="" />
      <div class="modal-copy">
        <p id="modalDate" class="modal-date"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalExplanation" class="modal-explanation"></p>
      </div>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
